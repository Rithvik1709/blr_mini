[project]
name = "blr"
version = "0.1.0"
description = "Isometric pixel-art map of Bengaluru, after tiny.london"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.0",
  "pillow>=11.0",
  "playwright>=1.50",
  "scipy>=1.17.1",
  "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
